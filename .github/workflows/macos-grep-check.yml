# TEMPORARY, throwaway proof for issue #125 — delete this file (and the branch) once the run
# is inspected. It does NOT ship as project CI: no PR/schedule trigger, not referenced from
# test.yml or release.yml.
#
# Purpose: prove that the eight secret-scan grep patterns and the mask() awk function in
# agents/npm-publisher.md (section "6. Secret patterns (CRITICAL)") behave identically on
# real Apple/BSD grep (macos-latest) and GNU grep (ubuntu-latest) — the one thing that could
# not be checked by reading the FreeBSD grep(1) manual or running GNU grep locally.
#
# The eight grep lines and the mask() definition are extracted programmatically from the
# current agents/npm-publisher.md at run time (see "Extract patterns" step below) — nothing
# here is hand-copied, so there is no transcription-error risk between doc and test.

name: "[TEMP] Issue #125 – macOS grep parity proof"

on:
  push:
    branches:
      - fix/publisher-hardening-t1
  workflow_dispatch:

jobs:
  grep-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show which grep/awk this runner actually has
        run: |
          echo "runner: ${{ matrix.os }}"
          grep --version 2>&1 | head -1 || true
          awk --version 2>&1 | head -1 || true
          which grep awk

      - name: Extract the eight patterns + mask() verbatim from agents/npm-publisher.md
        run: |
          python3 - <<'PY'
          import re, pathlib

          text = pathlib.Path("agents/npm-publisher.md").read_text(encoding="utf-8")
          start = text.index("**6. Secret patterns")
          section = text[start:start + 6000]
          m = re.search(r"```bash\n(.*?)\n```", section, re.S)
          if not m:
              raise SystemExit("could not find the section 6 fenced code block")
          code = m.group(1)

          # join backslash-continued physical lines (pattern #8 wraps) into one logical line
          joined, buf = [], ""
          for l in code.splitlines():
              buf = (buf.rstrip("\\").rstrip() + " " + l.strip()) if buf else l
              if buf.rstrip().endswith("\\"):
                  continue
              joined.append(buf)
              buf = ""
          if buf:
              joined.append(buf)

          mask_lines = [l for l in joined if l.strip().startswith("mask()")]
          grep_lines = [l for l in joined if l.strip().startswith("grep ")]

          if len(mask_lines) != 1:
              raise SystemExit(f"expected exactly 1 mask() line, found {len(mask_lines)}: {mask_lines}")
          if len(grep_lines) != 8:
              raise SystemExit(f"expected exactly 8 grep lines, found {len(grep_lines)}: {grep_lines}")

          pathlib.Path("mask_line.txt").write_text(mask_lines[0] + "\n", encoding="utf-8")
          pathlib.Path("grep_lines.txt").write_text("\n".join(grep_lines) + "\n", encoding="utf-8")

          print("mask():", mask_lines[0])
          for i, l in enumerate(grep_lines, 1):
              print(f"[{i}]", l)
          PY

      - name: Build fixtures (fabricated values only — no real secret matches any real format)
        run: |
          python3 - <<'PY'
          import pathlib

          base = pathlib.Path("fixture")

          def write(name, lines):
              d = base / name
              d.mkdir(parents=True, exist_ok=True)
              (d / "data.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")

          write("01_jwt", [
              "positive: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIn0.dGhpc19pc19hX2Zha2Vfc2lnbmF0dXJlX2Zvcl90ZXN0",
              "negative: not.a.jwt.at.all",
          ])
          # The fixture values are invented, but they are shaped like the real thing —
          # which is the point, and which makes GitHub's push protection reject the file
          # if a full token sits in it as one literal. Every prefix is therefore split
          # across adjacent string literals; Python concatenates them at parse time, so
          # the written fixture is byte-identical to the value shown here.
          write("02_npm", [
              "positive: npm" "_faketoken1234567890ABCDEFGHIJKLMNOPQR",
              "negative: npm" "_shorttoken123",
          ])
          write("03_ghp", [
              "positive ghp: ghp" "_faketoken1234567890ABCDEFGHIJKLMNOPQR",
              "positive github_pat: github" "_pat_abcdefghij1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij1234567890ABCDEFGHIJKLMNOPQR",
              "negative: ghp" "_tooshort123",
          ])
          write("04_openai", [
              "positive sk: sk" "-faketoken1234567890ABCDEFGHIJKLMNOPQR",
              "positive sk-proj: sk" "-proj-abcdefghij1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ",
              "negative: sk" "-tooshort123",
          ])
          write("05_anthropic", [
              "positive: sk" "-ant-abcdefghij1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ",
              "negative: sk" "-ant-short",
          ])
          write("06_slack", [
              "positive: xox" "b-1234567890-1234567890-abcdefghijklmnopqrstuvwxyz",
              "negative bad-letter: xox" "z-1234567890abcdefghij",
              "negative too-short: xox" "b-short",
          ])
          write("07_aws", [
              "positive: AKIA" "ABCDEFGHIJ123456",
              "negative short: AKIA" "1234567",
              "negative lowercase: akia" "abcdefghij123456",
          ])
          write("08_generic", [
              'api_key = "abcdefghij1234567890"',
              "api-key : 'ABCDEFGHIJabcdefghij12'",
              'password = "SuperSecretPassw0rd1234567890"',
              "secret = nonquotedvalue1234567890abcdefgh",
              'token = "tok_abcdefghij1234567890"',
              "bearer = abcdefghijklmnopqrstuvwxyz1234567890",
              'credential = "credvalueabcdefghij1234567890"',
              "this system is passwordless, nothing to configure",
              "secret=short",
              "random text with no keyword at all here 1234567890abcdef",
          ])
          PY

      - name: Run each extracted pattern against its fixture, assert exact match counts, check mask()
        run: |
          set -u -o pipefail
          FAIL=0

          eval "$(cat mask_line.txt)"

          check() {
            name="$1"; expected="$2"; actual="$3"
            if [ "$actual" -ne "$expected" ]; then
              echo "✗ FAIL [$name]: expected $expected match(es), got $actual"
              FAIL=1
            else
              echo "✓ OK   [$name]: $actual match(es) (expected $expected)"
            fi
          }

          : > masked_output_all.txt

          run_pattern() {
            idx="$1"; dir="$2"; expected="$3"; label="$4"
            line=$(sed -n "${idx}p" grep_lines.txt)
            cmd=$(printf '%s' "$line" | sed "s#\"\$PKG_DIR\"#\"$dir\"#")
            actual=$(eval "$cmd" | tee -a masked_output_all.txt | wc -l | tr -d '[:space:]')
            check "$label" "$expected" "$actual"
          }

          run_pattern 1 fixture/01_jwt       1 "JWT"
          run_pattern 2 fixture/02_npm       1 "npm token"
          run_pattern 3 fixture/03_ghp       2 "GitHub PAT (ghp_ + github_pat_)"
          run_pattern 4 fixture/04_openai    2 "OpenAI (sk- + sk-proj-)"
          run_pattern 5 fixture/05_anthropic 1 "Anthropic sk-ant-"
          run_pattern 6 fixture/06_slack     1 "Slack xox[bpaorsl]-"
          run_pattern 7 fixture/07_aws       1 "AWS AKIA"
          run_pattern 8 fixture/08_generic   7 "generic api_key/password/secret/token/bearer/credential"

          echo "--- mask() plaintext-hidden check ---"
          # Same reason as in the fixture generator above: a credential-shaped literal
          # trips GitHub push protection and blocks the whole branch. Bash concatenates
          # adjacent quoted strings, so these are the identical values.
          SECRETS=(
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIn0.dGhpc19pc19hX2Zha2Vfc2lnbmF0dXJlX2Zvcl90ZXN0"
            "npm""_faketoken1234567890ABCDEFGHIJKLMNOPQR"
            "ghp""_faketoken1234567890ABCDEFGHIJKLMNOPQR"
            "github""_pat_abcdefghij1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghij1234567890ABCDEFGHIJKLMNOPQR"
            "sk""-faketoken1234567890ABCDEFGHIJKLMNOPQR"
            "sk""-proj-abcdefghij1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            "sk""-ant-abcdefghij1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ"
            "xox""b-1234567890-1234567890-abcdefghijklmnopqrstuvwxyz"
            "AKIA""ABCDEFGHIJ123456"
            "abcdefghij1234567890"
            "ABCDEFGHIJabcdefghij12"
            "SuperSecretPassw0rd1234567890"
            "nonquotedvalue1234567890abcdefgh"
            "tok_abcdefghij1234567890"
            "abcdefghijklmnopqrstuvwxyz1234567890"
            "credvalueabcdefghij1234567890"
          )
          for s in "${SECRETS[@]}"; do
            if grep -qF -- "$s" masked_output_all.txt; then
              echo "✗ FAIL: plaintext secret still visible after mask(): $s"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "✓ OK   : none of the ${#SECRETS[@]} fabricated plaintext secrets appear in mask()'d output"
          fi

          if ! grep -qF '…' masked_output_all.txt; then
            echo "✗ FAIL: mask() output contains no '…' — masking may not have run at all"
            FAIL=1
          else
            echo "✓ OK   : mask() output contains the expected ellipsis abbreviation"
          fi

          echo "--- full masked output for manual inspection ---"
          cat masked_output_all.txt

          exit "$FAIL"
